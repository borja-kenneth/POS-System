<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Til · POS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div id="loginScreen"></div>

  <div id="appShell" class="app-shell" hidden>
    <header id="appHeader">
      <div class="brand"><h1>Til<span>·</span>POS</h1></div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="header-actions">
        <button class="icon-btn" id="stockAlertBtn" type="button" onclick="openLowStockPopup()" aria-label="Low stock notifications">
          <span class="bell-icon">🔔</span>
          <span id="stockAlertBadge" class="header-badge" hidden>0</span>
        </button>
        <div class="user-chip" id="userChip"></div>
        <button class="logout-btn" type="button" onclick="logout()">Log out</button>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <div class="modal-overlay" id="lowStockModal" hidden>
    <div class="modal-card low-stock-modal" role="dialog" aria-modal="true" aria-labelledby="lowStockTitle">
      <div class="modal-head">
        <div>
          <div class="eyebrow">INVENTORY NOTICE</div>
          <h2 id="lowStockTitle">Stock needs attention</h2>
        </div>
        <button class="modal-close" type="button" onclick="closeLowStockPopup()" aria-label="Close">×</button>
      </div>
      <div id="lowStockModalBody"></div>
      <div class="modal-actions">
        <button class="btn secondary" type="button" onclick="closeLowStockPopup()">Close</button>
        <button class="btn" id="viewInventoryBtn" type="button" onclick="closeLowStockPopup(); render('inventory')">View stock</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addProductModal" hidden>
    <div class="modal-card add-product-modal" role="dialog" aria-modal="true" aria-labelledby="addProductTitle">
      <div class="modal-head">
        <div>
          <div class="eyebrow">PRODUCT MANAGEMENT</div>
          <h2 id="addProductTitle">Add product</h2>
        </div>
        <button class="modal-close" type="button" onclick="closeAddProduct()" aria-label="Close">×</button>
      </div>
      <form id="addProductForm" class="modal-form" onsubmit="event.preventDefault(); submitAddProduct()">
        <label>Product name<input id="addProductName" required maxlength="150" placeholder="e.g. Oat Milk 1L"></label>
        <label>Category<select id="addProductCategory" required></select></label>
        <div class="form-two-col">
          <label>Cost<input id="addProductCost" type="number" min="0" step="0.01" value="0" required></label>
          <label>Price<input id="addProductPrice" type="number" min="0" step="0.01" value="0" required></label>
        </div>
        <label>Alert when stock reaches<input id="addProductWarning" type="number" min="0" step="1" value="10" required><span class="form-help">Show a low-stock warning when this many or fewer are left.</span></label>
        <label>Starting stock<input id="addProductStock" type="number" min="0" step="1" value="0" required></label>
        <div id="addProductError" class="form-error" hidden></div>
        <div class="modal-actions">
          <button class="btn secondary" type="button" onclick="closeAddProduct()">Cancel</button>
          <button class="btn" id="addProductSubmit" type="submit">Add product</button>
        </div>
      </form>
    </div>
  </div>

  <div class="pos-overlay" id="posOverlay">
    <div class="pos-receipt" id="posReceiptBody"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
